gaps:
- No SDK for the LSO Sonata (MEF/TM Forum) APIs in any language.
- No SDK for the CAMARA / Open Gateway APIs; Telia's network-API developer
  channel is Nokia Network as Code rather than a Telia-published client library.
- No SDK for the Bulk Messaging SMS REST or SMPP APIs - the public
  implementation guide ships raw cURL only.
