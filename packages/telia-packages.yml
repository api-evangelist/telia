notes: >-
  Telia Company publishes no client SDK for its LSO Sonata, CAMARA or Bulk
  Messaging APIs. It does publish a large, actively maintained first-party
  JavaScript package estate on npm for the Telia ACE contact-centre product
  under the @telia-ace scope (ACE Knowledge widgets, ACE Web SDK, ACE Alliance),
  plus two design-system libraries under @telia / @teliads. Every package below
  was resolved live against registry.npmjs.org on 2026-07-25 and carries a Telia
  ACE / Telia Company description, homepage or repository, which is what
  "official: true" is asserting. Registries probed with no first-party Telia
  result - PyPI (https://pypi.org/simple/telia/ HTTP 404), Maven Central, NuGet,
  pkg.go.dev, RubyGems, Packagist, crates.io.
