- aid: telia:telia-bulk-messaging-smpp-api
  name: Telia Bulk Messaging SMPP API
  description: SMPP v3.4-style binary protocol interface into the Telia Company Bulk
    Messaging Platform, reached over TLS 1.2 or better at smpp.messaging.teliacompany.com
    port 3550 with SNI required. Supports bind_transmitter, bind_receiver,
    bind_transceiver, unbind, enquire_link, submit_sm and deliver_sm, with vendor
    specific command status codes and network error code TLVs. Access requires static
    source IP addresses to be whitelisted in Telia's ACL, which makes this a
    contract-first, sales-led onboarding rather than a self-serve one.
  humanURL: https://cdn.messaging.teliacompany.com/documents/developer/index.html
  baseURL: smpp://smpp.messaging.teliacompany.com:3550
