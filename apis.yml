- aid: telia:telia-ace-knowledge-rest-api
  name: Telia ACE Knowledge REST API
  description: The REST API behind Telia ACE Knowledge (formerly Humany), the
    self-service knowledge and contact-deflection product inside the Telia ACE
    contact-centre suite. Telia documents it openly on GitHub — no login, no
    agreement — which makes it the second-most openly specified API Telia
    publishes. It follows a tenant-projection URL pattern of application domain
    plus interface name plus API keyword, and carries three documented surfaces —
    the Matching API for searching answers and retrieving knowledge-base content,
    the Notices API for listing notices, news and alerts, and the Contact API for
    listing contact methods and posting form data. Pagination is skip and take,
    custom entity parameters are passed with a p. prefix, and an interface can be
    made public or access-restricted from the administration portal.
  humanURL: https://github.com/telia-oss/ace-knowledge-docs
  baseURL: https://support.humany.net
  tags:
  - Contact Center
  - Knowledge Base
  - Self-Service
  - ACE Knowledge
  - Humany
  - Search
  tags_raw:
  - Contact Center
  - Knowledge Base
  - Self Service
  - ACE Knowledge
  - Humany
  - Search
