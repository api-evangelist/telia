- aid: telia:telia-ace-web-api
  name: Telia ACE Web API
  description: Client-side and server-side REST interface that lets an end user
    communicate with a Telia ACE contact centre from the customer's own website.
    Telia publishes it in two versions — a Client version callable directly from
    browsers with a restricted result and parameter set, and an authenticated
    Server version for server-to-server integration that returns extensive contact
    centre information. Documented capabilities are creating callbacks in real
    time or from scheduled availability, checking queue status by queue name or
    contact data, retrieving entrance and menu-selection opening hours, checking
    whether inputs and menu selections are currently open, and exporting changelog
    and audit records. All calls are HTTPS GET and POST. A first-party npm client
    is published as @telia-ace/web-api; no specification is public.
  humanURL: https://ace-showcase.com/marketplace/ace-web-api/
  tags:
  - Contact Center
  - Callback
  - Queue Status
  - Opening Hours
  - ACE
  properties:
  - type: Documentation
    url: https://ace-showcase.com/marketplace/ace-web-api/
  - type: SDKs
    url: https://www.npmjs.com/package/@telia-ace/web-api
