- aid: telia:telia-camara-quality-on-demand-api
  name: Telia CAMARA Quality on Demand API
  description: CAMARA Quality on Demand (QoD) API listed on Telia's CAMARA portal,
    allowing an application to request a higher-quality network connection. Named and
    described on the anonymously readable portal home page, but the portal's API
