name: Telia Company
kind: company
description: Telia Company is the Nordic and Baltic telecommunications group headquartered
  in Solna, Sweden, operating mobile and fixed networks in Sweden, Finland, Norway,
  Denmark, Lithuania, Latvia and Estonia, plus a global carrier and IoT business.
  As a mobile network operator it sits on the connectivity side of the telecom value
  chain rather than the developer-facing side, and its API posture reflects that
  split. Telia runs a real first-party developer hub at developer.teliacompany.io
  that fronts exactly two programmes — LSO Sonata (MEF/Mplify and TM Forum derived
  wholesale ordering APIs) and CAMARA (GSMA Open Gateway network APIs) — but both
  catalogs sit on Apigee portals that require an existing commercial agreement with
  Telia, a whitelisted corporate email domain and manual support approval before any
  specification or credential is issued. Only one OpenAPI definition is downloadable
  anonymously across the whole estate. Its CAMARA portal names Quality on Demand and
  Device Location but publishes nothing callable without login, and Telia reaches
  network-API developers mainly through Nokia's Network as Code aggregator platform
  rather than directly. The genuinely open surface is a public Bulk Messaging
  implementation guide covering an SMPP endpoint and an SMS REST API, and a gRPC
  audio-forwarding contract for its Telia ACE contact-centre product.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
