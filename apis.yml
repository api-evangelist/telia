- aid: telia:telia-ace-knowledge-contact-method-webhook
  name: Telia ACE Knowledge Contact Method WebHook
  description: The outbound webhook surface of Telia ACE Knowledge. A contact method
    of type Web service forwards an end user's form submission and the current ACE
    Knowledge parameter context to an external HTTP endpoint the customer
    implements, and injects the response back into the widget as a dynamic answer.
    Telia publishes the full contract openly — request content types of JSON, XML
    or form-urlencoded, response types of text/html or text/plain, a hard 15
    second budget for the receiver, custom headers that can be stored encrypted,
    and optional HMAC SHA256 JWT request signing in an X-ACE-Signature header
    carrying iss, aud, exp, iat, content_hash, method and path claims. This is the
    only Telia event surface whose specification is available without a login.
  humanURL: https://github.com/telia-oss/ace-knowledge-docs/blob/master/REST/webhook.md
  tags:
  - Contact Center
  - Webhook
  - Event
  - Request Signing
  - ACE Knowledge
