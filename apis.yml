- aid: telia:telia-bulk-messaging-sms-rest-api
  name: Telia Bulk Messaging SMS REST API
  description: JSON REST API for submitting mobile-terminated SMS through the Telia
    Company Bulk Messaging Platform, with a Submit SMS message operation (POST
    ~/messages) and a Submit SMS content operation for custom content and UDH headers.
    Authentication is HTTP Basic with credentials created in the Bulk Messaging web
    portal. Telia states the REST APIs are documented as OpenAPI, but those definitions
    are hosted in the portal's Documents section behind a login and were not retrievable
    anonymously. The publicly readable implementation guide is the only open artifact.
  humanURL: https://cdn.messaging.teliacompany.com/documents/developer/index.html
  baseURL: https://api.messaging.teliacompany.com/sms/rest/v2
  tags:
  - Messaging
  - SMS
  - Bulk Messaging
  - CPaaS
  properties:
  - type: Documentation
    url: https://cdn.messaging.teliacompany.com/documents/developer/index.html
  - type: APIReference
    url: https://cdn.messaging.teliacompany.com/documents/developer/index.html
- aid: telia:telia-bulk-messaging-sms-callback-api
  name: Telia Bulk Messaging SMS Callback API
  description: The webhook half of Telia's Bulk Messaging REST surface. Customers must
    implement a Receive SMS (mobile originated) operation and a Receive delivery report
    (DLR) operation to accept callbacks pushed by the Telia Company Bulk Messaging
    Platform, and the implementation must match the OpenAPI specification Telia
    provides through the portal. No AsyncAPI is published and the specification is not
    available anonymously.
  humanURL: https://cdn.messaging.teliacompany.com/documents/developer/index.html
  tags:
  - Messaging
  - SMS
  - Webhooks
  - Callbacks
  - Delivery Reports
  properties:
  - type: Documentation
    url: https://cdn.messaging.teliacompany.com/documents/developer/index.html
  - type: APIReference
    url: https://cdn.messaging.teliacompany.com/documents/developer/index.html
- aid: telia:telia-bulk-messaging-smpp-api
  name: Telia Bulk Messaging SMPP API
  description: SMPP v3.4-style binary protocol interface into the Telia Company Bulk
    Messaging Platform, reached over TLS 1.2 or better at smpp.messaging.teliacompany.com
    port 3550 with SNI required. Supports bind_transmitter, bind_receiver,
    bind_transceiver, unbind, enquire_link, submit_sm and deliver_sm, with vendor
    specific command status codes and network error code TLVs. Access requires static
    source IP addresses to be whitelisted in Telia's ACL, which makes this a
    contract-first, sales-led onboarding rather than a self-serve one.
  humanURL: https://cdn.messaging.teliacompany.com/documents/developer/index.html
  baseURL: smpp://smpp.messaging.teliacompany.com:3550
  tags:
  - Messaging
  - SMS
  - SMPP
  - Carrier
  properties:
  - type: Documentation
    url: https://cdn.messaging.teliacompany.com/documents/developer/index.html
  - type: APIReference
    url: https://cdn.messaging.teliacompany.com/documents/developer/index.html
- aid: telia:telia-ace-audio-stream-forwarding-api
  name: Telia ACE Audio Stream Forwarding API
  description: Bidirectional streaming gRPC service over HTTP/2 that forwards copies of
    the audio streams in Telia ACE contact-centre voice calls to a customer-implemented
    receiver, for transcription, summarisation, intent analysis, fraud detection or
    custom recording. Telia publishes the proto3 service definition, a sender simulator
    and an example receiver openly on GitHub. Authentication is mutual TLS with client
    certificates. This is the most openly specified API Telia publishes.
  humanURL: https://github.com/telia-oss/ace-audio-stream-forwarding-api
  tags:
  - Contact Center
  - Voice
  - gRPC
  - Streaming
  - mTLS
  properties:
  - type: Documentation
    url: https://github.com/telia-oss/ace-audio-stream-forwarding-api
  - type: gRPC
    url: proto/telia-ace-audio-stream-forwarding-v1.proto
  - type: SourceCode
    url: https://github.com/telia-oss/ace-audio-stream-forwarding-api
- aid: telia:telia-tunnistus-identification-broker
  name: Telia Tunnistus Identification Broker
  description: Telia Tunnistus is Telia Finland's identification broker service — an
    OpenID Connect and OAuth 2.0 identity provider that brokers Finnish strong
    electronic identification. The OpenID discovery document is served anonymously at
    tunnistus.telia.fi with issuer https://tunnistus.telia.fi/uas, supporting
    authorization_code, client_credentials, refresh_token, password and SAML2 bearer
    grants. Notably it does NOT advertise a CIBA backchannel authentication endpoint,
    which is the grant CAMARA specifies for network-based authorization. Integration
    guides are published as PDFs in a Telia GitHub repository.
  humanURL: https://github.com/telia-oss/tunnistus
  baseURL: https://tunnistus.telia.fi/uas
  tags:
  - Identity
  - OpenID Connect
  - OAuth
  - Strong Authentication
  - Finland
  properties:
  - type: Documentation
    url: https://github.com/telia-oss/tunnistus
  - type: OpenIDConnectDiscovery
    url: https://tunnistus.telia.fi/.well-known/openid-configuration
  - type: SourceCode
    url: https://github.com/telia-oss/tunnistus
