- aid: telia:telia-bulk-messaging-sms-rest-api
  name: Telia Bulk Messaging SMS REST API
  description: JSON REST API for submitting mobile-terminated SMS through the Telia
    Company Bulk Messaging Platform, with a Submit SMS message operation (POST
    ~/messages) and a Submit SMS content operation for custom content and UDH headers.
    Authentication is HTTP Basic with credentials created in the Bulk Messaging web
    portal. Telia states the REST APIs are documented as OpenAPI, but those definitions
    are hosted in the portal's Documents section behind a login and were not retrievable
    anonymously. The publicly readable implementation guide is the only open artifact.
  humanURL: https://cdn.messaging.teliacompany.com/documents/developer/index.html
  baseURL: https://api.messaging.teliacompany.com/sms/rest/v2
