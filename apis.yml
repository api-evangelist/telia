- aid: telia:telia-lso-sonata-geographic-site-management-api
  name: Telia LSO Sonata Geographic Site Management API
  description: MEF 122 / MEF 79 geographic site management API in Telia's LSO Sonata
    wholesale programme, designed using TM Forum TMF674 as its template. Retrieves a
    list of geographic sites and full detail for a single site, per country. This is
    the only Telia OpenAPI definition that could be downloaded anonymously — the
    portal serves it without a login at /liveportal/apis/{apiId}/download_spec.
  humanURL: https://lso.teliacompany.com/apis
  baseURL: https://api-garden.teliacompany.com/v1/api/mef/geographicSiteManagement
