maintenance:
  smpp_patching: >-
    Telia publishes its maintenance protocol for SMPP - the SMSC initiates a
    graceful unbind, the ESME must acknowledge and immediately re-bind, and
    during maintenance windows unbinds are staggered between sessions to
    minimise ESME downtime. Customers can also trigger a graceful unbind
    themselves from the Bulk Messaging portal.
