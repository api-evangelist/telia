method: searched
source: https://github.com/telia-oss/ace-widgets
notes: >-
  Telia's richest openly documented developer surface is not an API at all - it
  is the ACE Knowledge Widgets component library, a set of embeddable
  client-side components for self-service and conversational customer support,
  documented publicly on GitHub and shipped as versioned npm packages. Two Telia
  design systems are also published openly. None of this requires a Telia
  commercial agreement to read, which makes it the opposite of the rest of the
  estate.
